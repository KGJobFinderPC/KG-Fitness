<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KG Fitness | Reset Password</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="login-page">

        <!-- LEFT FITNESS IMAGE -->

        <section class="fitness-side left-side">

            <div class="image-overlay"></div>

            <div class="side-content">

                <span>KG FITNESS</span>

                <h2>
                    New Password.<br>
                    New Start.
                </h2>

                <p>
                    Secure your KG Fitness account.
                </p>

            </div>

        </section>


        <!-- RESET PASSWORD CENTER -->

        <section class="login-center">

            <div class="login-card">

                <div class="brand">

                    <div class="brand-kg">
                        KG
                    </div>

                    <div class="brand-name">
                        FITNESS
                    </div>

                </div>


                <p class="welcome">
                    RESET PASSWORD
                </p>


                <h1>
                    Create a new password
                </h1>


                <p class="login-description">
                    Enter your new password below.
                </p>


                <form id="resetPasswordForm">


                    <!-- NEW PASSWORD -->

                    <div class="input-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <div
                            class="password-wrapper"
                            style="position: relative;"
                        >

                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="newPasswordToggle"
                                aria-label="Show password"
                                style="
                                    position:absolute;
                                    right:15px;
                                    top:50%;
                                    transform:translateY(-50%);
                                    border:none;
                                    background:transparent;
                                    color:#a7adbd;
                                    font-size:18px;
                                    cursor:pointer;
                                "
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <div
                            class="password-wrapper"
                            style="position: relative;"
                        >

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="confirmPasswordToggle"
                                aria-label="Show password"
                                style="
                                    position:absolute;
                                    right:15px;
                                    top:50%;
                                    transform:translateY(-50%);
                                    border:none;
                                    background:transparent;
                                    color:#a7adbd;
                                    font-size:18px;
                                    cursor:pointer;
                                "
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="resetMessage"
                        class="login-message"
                    ></div>


                    <!-- RESET BUTTON -->

                    <button
                        type="submit"
                        class="login-submit"
                        id="resetPasswordBtn"
                    >
                        UPDATE PASSWORD
                    </button>


                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button
                    type="button"
                    class="back-btn"
                    id="backToLoginBtn"
                >
                    ← BACK TO LOGIN
                </button>


            </div>

        </section>


        <!-- RIGHT FITNESS IMAGE -->

        <section class="fitness-side right-side">

            <div class="image-overlay"></div>

            <div class="side-content">

                <span>KG FITNESS</span>

                <h2>
                    Your Account.<br>
                    Your Security.
                </h2>

                <p>
                    Keep your account protected.
                </p>

            </div>

        </section>

    </main>


    <script type="module">

        import { supabase }
            from "./supabase.js";


        // ===============================
        // RESET PASSWORD
        // ===============================

        const resetForm =
            document.getElementById(
                "resetPasswordForm"
            );


        const message =
            document.getElementById(
                "resetMessage"
            );


        const resetButton =
            document.getElementById(
                "resetPasswordBtn"
            );


        if (resetForm) {

            resetForm.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    const newPassword =
                        document.getElementById(
                            "newPassword"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    message.textContent = "";

                    message.style.color = "";


                    // ===============================
                    // CHECK PASSWORD
                    // ===============================

                    if (
                        !newPassword ||
                        !confirmPassword
                    ) {

                        message.textContent =
                            "Please complete both password fields.";

                        message.style.color =
                            "#ff6b6b";

                        return;
                    }


                    if (
                        newPassword.length < 6
                    ) {

                        message.textContent =
                            "Password must contain at least 6 characters.";

                        message.style.color =
                            "#ff6b6b";

                        return;
                    }


                    if (
                        newPassword !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "Passwords do not match.";

                        message.style.color =
                            "#ff6b6b";

                        return;
                    }


                    // ===============================
                    // LOADING
                    // ===============================

                    resetButton.disabled =
                        true;

                    resetButton.textContent =
                        "UPDATING...";


                    try {

                        const {
                            error
                        } =
                            await supabase.auth.updateUser({
                                password:
                                    newPassword
                            });


                        if (error) {

                            console.error(
                                "Password update error:",
                                error
                            );


                            message.textContent =
                                error.message;

                            message.style.color =
                                "#ff6b6b";


                            resetButton.disabled =
                                false;

                            resetButton.textContent =
                                "UPDATE PASSWORD";

                            return;
                        }


                        // ===============================
                        // SUCCESS
                        // ===============================

                        message.textContent =
                            "Password updated successfully!";

                        message.style.color =
                            "#ffd84d";


                        resetButton.textContent =
                            "PASSWORD UPDATED";


                        setTimeout(() => {

                            window.location.href =
                                "login.html";

                        }, 2000);

                    }

                    catch (error) {

                        console.error(
                            "Unexpected password update error:",
                            error
                        );


                        message.textContent =
                            "Something went wrong. Please try again.";

                        message.style.color =
                            "#ff6b6b";


                        resetButton.disabled =
                            false;

                        resetButton.textContent =
                            "UPDATE PASSWORD";

                    }

                }
            );

        }


        // ===============================
        // PASSWORD TOGGLE
        // ===============================

        function setupPasswordToggle(
            inputId,
            buttonId
        ) {

            const input =
                document.getElementById(
                    inputId
                );

            const button =
                document.getElementById(
                    buttonId
                );


            if (!input || !button) {

                return;
            }


            button.addEventListener(
                "click",
                () => {

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type =
                            "text";

                        button.textContent =
                            "🙈";

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        input.type =
                            "password";

                        button.textContent =
                            "👁️";

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                }
            );

        }


        setupPasswordToggle(
            "newPassword",
            "newPasswordToggle"
        );


        setupPasswordToggle(
            "confirmPassword",
            "confirmPasswordToggle"
        );


        // ===============================
        // BACK TO LOGIN
        // ===============================

        const backToLoginBtn =
            document.getElementById(
                "backToLoginBtn"
            );


        if (backToLoginBtn) {

            backToLoginBtn.addEventListener(
                "click",
                () => {

                    window.location.href =
                        "login.html";

                }
            );

        }

    </script>

</body>

</html>
