<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - KG Fitness</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="create-account.css">

    <style>
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #a7adbd;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #ffd84d;
        }
    </style>
</head>

<body>

    <main class="register-page">

        <!-- LEFT FITNESS IMAGE -->
        <section class="register-side left-side">
            <div class="image-overlay"></div>

            <div class="side-content">
                <span>KG FITNESS</span>

                <h2>
                    BUILD<br>
                    YOUR<br>
                    FUTURE.
                </h2>

                <p>
                    Create your account and start your fitness journey.
                </p>
            </div>
        </section>


        <!-- CENTER REGISTER FORM -->
        <section class="register-center">

            <div class="register-card">

                <!-- BRAND -->
                <div class="brand">
                    <span class="brand-kg">KG</span>
                    <span class="brand-name">FITNESS</span>
                </div>


                <!-- TITLE -->
                <div class="welcome">
                    START YOUR JOURNEY
                </div>

                <h1>
                    Create Account
                </h1>

                <p class="register-description">
                    Create your free KG Fitness account and tell us about your goals.
                </p>


                <!-- FORM -->
                <form id="registerForm">

                    <!-- NAME -->
                    <div class="input-group">
                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">
                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                👁️
                            </button>
                        </div>
                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="confirmPasswordToggle"
                                aria-label="Show password"
                            >
                                👁️
                            </button>
                        </div>
                    </div>


                    <!-- HEIGHT + WEIGHT -->
                    <div class="form-row">

                        <div class="input-group">
                            <label for="height">
                                Height (cm)
                            </label>

                            <input
                                type="number"
                                id="height"
                                name="height"
                                placeholder="e.g. 175"
                                min="50"
                                max="250"
                                required
                            >
                        </div>


                        <div class="input-group">
                            <label for="weight">
                                Weight (kg)
                            </label>

                            <input
                                type="number"
                                id="weight"
                                name="weight"
                                placeholder="e.g. 75"
                                min="20"
                                max="400"
                                step="0.1"
                                required
                            >
                        </div>

                    </div>


                    <!-- AGE -->
                    <div class="input-group">
                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="13"
                            max="100"
                            required
                        >
                    </div>


                    <!-- LEVEL -->
                    <div class="input-group">
                        <label for="level">
                            Fitness Level
                        </label>

                        <select
                            id="level"
                            name="level"
                            required
                        >
                            <option value="">
                                Select your level
                            </option>

                            <option value="beginner">
                                Beginner
                            </option>

                            <option value="intermediate">
                                Intermediate
                            </option>

                            <option value="advanced">
                                Advanced
                            </option>

                            <option value="athlete">
                                Athlete
                            </option>
                        </select>
                    </div>


                    <!-- GOAL -->
                    <div class="input-group">
                        <label for="goal">
                            Main Goal
                        </label>

                        <select
                            id="goal"
                            name="goal"
                            required
                        >
                            <option value="">
                                Select your main goal
                            </option>

                            <option value="weight-loss">
                                Weight Loss / Fat Loss
                            </option>

                            <option value="muscle-building">
                                Muscle Building / Hypertrophy
                            </option>

                            <option value="strength">
                                Strength
                            </option>

                            <option value="power">
                                Power
                            </option>

                            <option value="endurance">
                                Endurance
                            </option>

                            <option value="cardio">
                                Cardio & Fitness
                            </option>

                            <option value="mobility">
                                Mobility & Flexibility
                            </option>

                            <option value="recovery">
                                Relaxation / Recovery
                            </option>

                            <option value="beginner-fitness">
                                Beginner / General Fitness
                            </option>

                            <option value="athlete-training">
                                Athlete / Competition Training
                            </option>

                            <option value="advanced-performance">
                                Advanced Performance
                            </option>

                            <option value="weight-maintenance">
                                Weight Maintenance
                            </option>

                            <option value="body-recomposition">
                                Body Recomposition
                            </option>

                            <option value="functional-training">
                                Functional Training
                            </option>

                            <option value="sport-performance">
                                Sport Performance
                            </option>
                        </select>
                    </div>


                    <!-- MESSAGE -->
                    <div
                        id="registerMessage"
                        class="register-message"
                    ></div>


                    <!-- CREATE BUTTON -->
                    <button
                        type="submit"
                        class="create-account-submit"
                    >
                        CREATE ACCOUNT
                    </button>

                </form>


                <!-- DIVIDER -->
                <div class="divider">
                    <span>ALREADY HAVE AN ACCOUNT?</span>
                </div>


                <!-- LOGIN -->
                <button
                    type="button"
                    class="login-btn"
                    onclick="window.location.href='login.html'"
                >
                    LOGIN
                </button>


                <!-- BACK -->
                <button
                    type="button"
                    class="back-btn"
                    onclick="window.location.href='index.html'"
                >
                    ← BACK
                </button>

            </div>

        </section>


        <!-- RIGHT FITNESS IMAGE -->
        <section class="register-side right-side">
            <div class="image-overlay"></div>

            <div class="side-content">
                <span>YOUR GOAL</span>

                <h2>
                    TRAIN<br>
                    SMART.<br>
                    LIVE STRONG.
                </h2>

                <p>
                    Your body. Your goal. Your journey.
                </p>
            </div>
        </section>

    </main>


    <script type="module" src="script.js"></script>

    <script>
        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const confirmPasswordToggle =
            document.getElementById("confirmPasswordToggle");


        if (passwordInput && passwordToggle) {

            passwordToggle.addEventListener(
                "click",
                () => {

                    if (passwordInput.type === "password") {

                        passwordInput.type = "text";

                        passwordToggle.textContent = "🙈";

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        passwordInput.type = "password";

                        passwordToggle.textContent = "👁️";

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );
                    }
                }
            );
        }


        if (confirmPasswordInput && confirmPasswordToggle) {

            confirmPasswordToggle.addEventListener(
                "click",
                () => {

                    if (confirmPasswordInput.type === "password") {

                        confirmPasswordInput.type = "text";

                        confirmPasswordToggle.textContent = "🙈";

                        confirmPasswordToggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        confirmPasswordInput.type = "password";

                        confirmPasswordToggle.textContent = "👁️";

                        confirmPasswordToggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );
                    }
                }
            );
        }
    </script>

</body>
</html>
