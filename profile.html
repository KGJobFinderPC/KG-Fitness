<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KG Fitness - My Profile</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="profile.css"
    >

</head>


<body>


    <!-- =============================== -->
    <!-- HEADER -->
    <!-- =============================== -->

    <header class="profile-header">

        <div class="header-left">

            <button
                id="backBtn"
                class="back-btn"
                type="button"
            >
                ←
            </button>

            <div>

                <span class="section-label">
                    ACCOUNT
                </span>

                <h1>
                    My Profile
                </h1>

            </div>

        </div>

    </header>



    <!-- =============================== -->
    <!-- MAIN -->
    <!-- =============================== -->

    <main class="profile-container">


        <!-- =============================== -->
        <!-- PROFILE INTRO -->
        <!-- =============================== -->

        <section class="profile-intro">

            <div class="profile-avatar">

                <span id="profileInitial">
                    A
                </span>

            </div>

            <div>

                <h2 id="displayName">
                    Loading...
                </h2>

                <p id="displayEmail">
                    Loading...
                </p>

            </div>

        </section>



        <!-- =============================== -->
        <!-- EDIT PROFILE -->
        <!-- =============================== -->

        <section class="profile-card">

            <div class="card-header">

                <div>

                    <span class="section-label">
                        PERSONAL INFORMATION
                    </span>

                    <h2>
                        Edit Profile
                    </h2>

                    <p>
                        Update your personal and fitness information.
                    </p>

                </div>

            </div>


            <form id="profileForm">


                <!-- =============================== -->
                <!-- FULL NAME -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- =============================== -->
                <!-- EMAIL -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        disabled
                    >

                    <small>
                        Email address cannot be changed here.
                    </small>

                </div>



                <!-- =============================== -->
                <!-- HEIGHT -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="height">
                        Height (cm)
                    </label>

                    <input
                        type="number"
                        id="height"
                        name="height"
                        placeholder="Enter your height"
                        min="1"
                        max="300"
                    >

                </div>



                <!-- =============================== -->
                <!-- WEIGHT -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        placeholder="Enter your weight"
                        min="1"
                        max="500"
                        step="0.1"
                    >

                </div>



                <!-- =============================== -->
                <!-- AGE -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                    >

                </div>



                <!-- =============================== -->
                <!-- FITNESS LEVEL -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="level">
                        Fitness Level
                    </label>

                    <select
                        id="level"
                        name="level"
                    >

                        <option value="">
                            Select fitness level
                        </option>

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </div>



                <!-- =============================== -->
                <!-- MAIN GOAL -->
                <!-- =============================== -->

                <div class="form-group">

                    <label for="goal">
                        Main Goal
                    </label>

                    <select
                        id="goal"
                        name="goal"
                    >

                        <option value="">
                            Select your main goal
                        </option>

                        <option value="build_muscle">
                            Build Muscle
                        </option>

                        <option value="lose_weight">
                            Lose Weight
                        </option>

                        <option value="get_stronger">
                            Get Stronger
                        </option>

                        <option value="improve_fitness">
                            Improve Fitness
                        </option>

                        <option value="maintain">
                            Maintain Fitness
                        </option>

                    </select>

                </div>



                <!-- =============================== -->
                <!-- MESSAGE -->
                <!-- =============================== -->

                <div
                    id="profileMessage"
                    class="profile-message"
                ></div>



                <!-- =============================== -->
                <!-- SAVE BUTTON -->
                <!-- =============================== -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        CANCEL
                    </button>

                    <button
                        type="submit"
                        id="saveProfileBtn"
                        class="save-btn"
                    >
                        SAVE CHANGES
                    </button>

                </div>


            </form>

        </section>



        <!-- =============================== -->
        <!-- ACCOUNT INFORMATION -->
        <!-- =============================== -->

        <section class="profile-card account-card">

            <div class="card-header">

                <div>

                    <span class="section-label">
                        ACCOUNT
                    </span>

                    <h2>
                        Account Information
                    </h2>

                </div>

            </div>


            <div class="account-row">

                <span>
                    Account Status
                </span>

                <strong class="account-status">
                    ACTIVE
                </strong>

            </div>


            <div class="account-row">

                <span>
                    Account Type
                </span>

                <strong id="accountType">
                    Athlete
                </strong>

            </div>


        </section>


    </main>



    <!-- =============================== -->
    <!-- JAVASCRIPT -->
    <!-- =============================== -->

    <script
        type="module"
        src="profile.js"
    ></script>


</body>

</html>
